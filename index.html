<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="warm">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />

  <!-- Early theme: avoid flash of wrong theme before app.js runs -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("ordinary.v1") || "{}");
        var theme = s.theme || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        var accent = s.accent || "warm";
        var d = document.documentElement;
        d.setAttribute("data-theme", theme);
        d.setAttribute("data-accent", accent);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#000000" : "#ffffff");
      } catch (e) {}
    })();
  </script>

   <!-- PWA / installable -->
   <link rel="manifest" href="/manifest.webmanifest" />
   <link rel="icon" href="/icon.svg" type="image/svg+xml" />
   <link rel="icon" href="/logo.jpg" sizes="any" type="image/jpeg" />
   <link rel="apple-touch-icon" href="/logo.jpg" />

  <!-- iOS standalone -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ordinary" />
  <meta name="application-name" content="Ordinary" />
  <meta name="format-detection" content="telephone=no" />

  <title>Ordinary — daily habits & notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="veil" aria-hidden="true"></div>

  <div class="app">
    <!-- ============ HEADER ============ -->
    <header class="topbar">
      <div class="topbar__inner">
        <div class="topbar__heading">
          <p class="eyebrow" id="eyebrow">Saturday, August 15</p>
          <h1 class="title" id="title">Today's Habits</h1>
        </div>
        <div class="topbar__controls">
          <button class="btn-add btn-add--sm" id="addMusicBtn" hidden>
            <span class="btn-add__plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
            Add
          </button>
          <button class="iconbtn" id="themeToggle" aria-label="Toggle light and dark theme">
            <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4.2"/>
              <path d="M12 2.4v2.2M12 19.4v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.4 12h2.2M19.4 12h2.2M4.4 19.6l1.6-1.6M18 6l1.6-1.6"/>
            </svg>
            <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 14.2A8 8 0 0 1 9.8 4 7 7 0 1 0 20 14.2z"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- ============ MAIN ============ -->
    <main class="stage" id="stage">

      <!-- ---------- HABITS ---------- -->
      <section class="view view--habits is-active" id="view-habits" aria-label="Today's habits">
        <div class="hero">
          <div class="avatar-wrap">
            <button class="avatar" id="avatarBtn" aria-label="Change profile photo" aria-haspopup="true">
              <img class="avatar__img" id="avatarImg" alt="" hidden />
              <span class="avatar__placeholder" id="avatarPh">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>
              </span>
              <span class="avatar__edit" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
              </span>
            </button>
            <div class="avmenu" id="avmenu" role="menu" hidden>
              <button class="avmenu__item" id="avChoose" role="menuitem">
                <svg viewBox="0 0 24 24"><path d="M4 16l4.5-4.5 3.5 3.5L16 9l4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><circle cx="9" cy="8" r="1.6"/></svg>
                Choose photo
              </button>
              <button class="avmenu__item danger" id="avRemove" role="menuitem" hidden>
                <svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M6.5 7l.7 12h9.6l.7-12"/></svg>
                Remove photo
              </button>
            </div>
          </div>
          <div class="hero__text">
            <p class="hero__hi" id="greet">Good day</p>
            <p class="hero__sub" id="heroDate">Saturday, August 15</p>
          </div>
        </div>

        <div class="progress">
          <div class="progress__head">
            <span class="progress__label">Today's progress</span>
            <span class="progress__count"><strong id="doneCount">0</strong>&nbsp;of&nbsp;<span id="totalCount">0</span>&nbsp;completed&nbsp;·&nbsp;<span id="pct">0%</span></span>
          </div>
          <div class="progress__track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progTrack">
            <div class="progress__fill" id="progFill"></div>
          </div>
        </div>

        <div class="list" id="habitList" aria-live="polite"></div>

        <button class="addhabit" id="addHabitBtn" aria-expanded="false">
          <span class="addhabit__plus" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </span>
          <span class="addhabit__text">Add habit</span>
        </button>

        <form class="addform" id="addForm" hidden>
          <input class="addform__input" id="addInput" type="text" placeholder="What would you like to do?" maxlength="60" autocomplete="off" aria-label="Habit name" />
          <div class="addform__actions">
            <button type="submit" class="btn btn--primary">Add</button>
            <button type="button" class="btn btn--ghost" id="addCancel">Cancel</button>
          </div>
        </form>
      </section>

      <!-- ---------- NOTE ---------- -->
      <section class="view view--note" id="view-note" aria-label="Today's note" hidden>
        <div class="note">
          <div class="note__editor" id="noteEditor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Today's note" data-placeholder="How was today? Write whatever you'd like to remember…"></div>
        </div>
        <div class="note__status" id="noteStatus" aria-live="polite">
          <span class="note__statusdot"></span>
          <span class="note__statustext">Saved</span>
        </div>
      </section>

      <!-- ---------- MUSIC (single streamlined screen) ---------- -->
      <section class="view view--music" id="view-music" aria-label="Music" hidden>
        <div class="music__stage">
          <!-- now-playing player -->
          <div class="music__player" id="musicPlayer" hidden>
            <button class="music__art" id="musicArt" aria-label="Change artwork">
              <img class="music__artimg" alt="" hidden />
              <svg class="music__articon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17V5l10-2v12"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/></svg>
            </button>
            <div class="music__meta">
              <div class="music__title" id="musicTitle">—</div>
              <div class="music__artist" id="musicArtist">Nothing playing</div>
            </div>
            <div class="music__timebar">
              <span class="music__cur" id="musicCur">0:00</span>
              <div class="music__bar" id="musicBar" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
                <div class="music__track"></div>
                <div class="music__fill" id="musicFill"></div>
                <div class="music__knob" id="musicKnob"></div>
              </div>
              <span class="music__dur" id="musicDur">0:00</span>
            </div>
            <div class="music__controls">
              <button class="music__ctrl" id="musicShuffle" aria-label="Shuffle">
                <svg viewBox="0 0 24 24"><path d="M4 5h3l3 4M16 5h4v4M4 19h4v-4M16 19h4l-4-4M14 9l3 3-3 3"/></svg>
              </button>
              <button class="music__ctrl" id="musicPrev" aria-label="Previous track">
                <svg viewBox="0 0 24 24"><path d="M7 5v14M19 5L9 12l10 7z"/></svg>
              </button>
              <button class="music__play" id="musicPlay" aria-label="Play">
                <svg id="musicPlayIcon" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
              </button>
              <button class="music__ctrl" id="musicNext" aria-label="Next track">
                <svg viewBox="0 0 24 24"><path d="M17 5v14M5 5l10 7-10 7z"/></svg>
              </button>
              <button class="music__ctrl" id="musicRepeat" aria-label="Repeat">
                <svg viewBox="0 0 24 24"><path d="M7 8a4 4 0 0 1 4-4h6M17 16a4 4 0 0 1-4 4H7M17 4l2 2-2 2M7 20l-2-2 2-2"/></svg>
              </button>
            </div>
          </div>

          <!-- empty state -->
          <div class="music__empty" id="musicEmpty" hidden>
            <div class="empty__title">No music yet</div>
            <div class="empty__text">Add a song from your files to get started.</div>
            <button class="btn btn--primary empty__btn" id="emptyAddMusic">
              <span class="btn-add__plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
              Add music
            </button>
          </div>

          <!-- compact track list (same screen) -->
          <div class="music__list" id="musicList"></div>
        </div>
      </section>

    </main>

    <!-- ============ BOTTOM NAV ============ -->
    <nav class="nav" id="nav" aria-label="Primary">
      <div class="nav__pill">
        <span class="nav__indicator" id="navIndicator" aria-hidden="true"></span>
        <button class="nav__item is-active" data-view="habits" aria-current="page">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.5h15M4.5 12h15M4.5 17.5h15"/></svg>
          <span class="nav__label">Habits</span>
        </button>
        <button class="nav__item" data-view="note">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19h14M6.5 16.5l9.6-9.6a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L9.9 19.9H6.5z"/></svg>
          <span class="nav__label">Note</span>
        </button>
        <button class="nav__item" data-view="music">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17V5l10-2v12"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/></svg>
          <span class="nav__label">Music</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- ============ MINI PLAYER (global) ============ -->
  <div class="mini" id="mini" hidden>
    <div class="mini__bar"><i id="miniBarFill"></i></div>
    <button class="mini__art" id="miniArt" aria-label="Open player">
      <img class="mini__artimg" alt="" hidden />
      <svg class="mini__articon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17V5l10-2v12"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/></svg>
    </button>
    <div class="mini__info">
      <div class="mini__title" id="miniTitle">—</div>
      <div class="mini__sub" id="miniSub">Nothing playing</div>
    </div>
    <div class="mini__controls">
      <button class="mini__btn" id="miniPrev" aria-label="Previous track">
        <svg viewBox="0 0 24 24"><path d="M7 5v14M19 5L9 12l10 7z"/></svg>
      </button>
      <button class="mini__btn mini__btn--play" id="miniPlay" aria-label="Play">
        <svg id="miniPlayIcon" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
      </button>
      <button class="mini__btn" id="miniNext" aria-label="Next track">
        <svg viewBox="0 0 24 24"><path d="M17 5v14M5 5l10 7-10 7z"/></svg>
      </button>
    </div>
  </div>

   <!-- ============ CONFIRM DIALOG ============ -->
  <div class="dialog" id="confirm" hidden>
    <div class="dialog__scrim" id="confirmScrim"></div>
    <div class="dialog__box" role="dialog" aria-modal="true">
      <p class="dialog__text" id="confirmText">Are you sure?</p>
      <div class="dialog__row">
        <button class="btn btn--ghost" id="confirmCancel">Cancel</button>
        <button class="btn btn--danger" id="confirmOk">Delete</button>
      </div>
    </div>
  </div>

  <!-- ============ TOAST ============ -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span class="toast__text" id="toastText">Habit deleted</span>
    <button class="toast__action" id="toastUndo">Undo</button>
  </div>

  <!-- ============ HIDDEN FILE INPUTS ============ -->
   <input type="file" id="avatarInput" accept="image/*" hidden />
   <input type="file" id="artworkInput" accept="image/*" hidden />
   <input type="file" id="musicFileInput" accept="audio/*" multiple hidden />
   <input type="file" id="musicFolderInput" accept="audio/*" webkitdirectory directory multiple hidden />

  <script src="app.js"></script>
</body>
</html>
